name: Build Signed Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ONESIGNAL_DISABLE_LOCATION: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx cap add android
      - run: npx cap copy android
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 -d > android/app/matloob-release.jks
      - name: Configure release signing
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> android/gradle.properties <<EOF
          MATLOOB_STORE_FILE=matloob-release.jks
          MATLOOB_STORE_PASSWORD=$STORE_PASSWORD
          MATLOOB_KEY_ALIAS=$KEY_ALIAS
          MATLOOB_KEY_PASSWORD=$KEY_PASSWORD
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          marker='android {'
          inject="""android {
              signingConfigs {
                  release {
                      storeFile file(project.findProperty("MATLOOB_STORE_FILE"))
                      storePassword project.findProperty("MATLOOB_STORE_PASSWORD")
                      keyAlias project.findProperty("MATLOOB_KEY_ALIAS")
                      keyPassword project.findProperty("MATLOOB_KEY_PASSWORD")
                  }
              }
          """
          s=s.replace(marker, inject, 1)
          s=s.replace('buildTypes {\n        release {', 'buildTypes {\n        release {\n            signingConfig signingConfigs.release', 1)
          p.write_text(s)
          PY
      - run: chmod +x android/gradlew
      - working-directory: android
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: matloob-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
