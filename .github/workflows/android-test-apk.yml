name: Build Android Test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'source.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'capacitor.config.ts'
      - '.github/workflows/android-test-apk.yml'

permissions:
  contents: read

concurrency:
  group: matloob-android-test
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Set Android version
        run: |
          sed -i 's/versionName "[^"]*"/versionName "1.0.0"/' android/app/build.gradle
          sed -i 's/versionCode [0-9][0-9]*/versionCode 1/' android/app/build.gradle
      - run: chmod +x android/gradlew
      - working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: matloob-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
