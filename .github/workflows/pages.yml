name: Build Web for GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'source.html'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matloob-web-build
  cancel-in-progress: true

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Sync production build to repository root
        run: |
          rm -rf assets
          cp -a dist/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets OneSignalSDKWorker.js icon-96.webp icon-192.webp icon-512.webp icon.svg manifest.webmanifest .nojekyll
          if git diff --cached --quiet; then
            echo "Production site is already current."
          else
            git commit -m "chore: sync GitHub Pages production build [skip ci]"
            git push origin HEAD:main
          fi
